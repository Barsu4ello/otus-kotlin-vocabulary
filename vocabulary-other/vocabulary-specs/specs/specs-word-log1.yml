openapi: 3.0.4
info:
  title: Vocabulary log models
  description: Log models for logging services of vocabulary
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  version: 1.0.0
paths: {}

components:
  schemas:
    CommonLogModel:
      title: Общая модель лога
      description: Общая модель лога для всех микросервисов системы
      type: object
      properties:
        messageTime:
          type: string
        logId:
          type: string
        source:
          type: string
        word:
          $ref: '#/components/schemas/VcblWordLogModel'
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ErrorLogModel'

    VcblWordLogModel:
      title: Модель лога для микросервиса Vocabulary
      type: object
      properties:
        requestId:
          type: string
        operation:
          $ref: '#/components/schemas/VcblLogOperation'
        requestWord:
          $ref: '#/components/schemas/WordLog'
        requestFilter:
          $ref: '#/components/schemas/WordFilterLog'
        responseWord:
          $ref: '#/components/schemas/WordLog'
        responseWords:
          type: array
          items:
            $ref: '#/components/schemas/WordLog'

    VcblLogOperation:
      type: string
      enum:
        - create
        - read
        - update
        - delete
        - search
        - init
        - finish

    ErrorLogModel:
      title: Модель лога для ошибки
      type: object
      properties:
        message:
          type: string
        field:
          type: string
        code:
          type: string
        level:
          type: string

    WordLog:
      title: Модель лога для слова
      type: object
      properties:
        id:
          type: string
        english:
          type: string
        russian:
          type: string
        ownerId:
          type: string
        partOfSpeech:
          type: string

    WordFilterLog:
      title: Модель лога фильтра
      properties:
        searchString:
          type: string
        ownerId:
          type: string