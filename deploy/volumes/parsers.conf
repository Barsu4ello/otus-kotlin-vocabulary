[PARSER]
  Name   nginx_parser
  Format regex
  Regex  ^access_log (?<remote_address>[^ ]*) "(?<method>\S+)(?: +(?<path>[^\"]*?)(?: +\S*)?)?" (?<status>[^ ]*) "(?<http_user_agent>[^\"]*)"$
  Types  status:integer

[PARSER]
  Name        json
  Format      json
  Time_Key    @timestamp
  #Time_Format %Y-%m-%dT%H:%M:%SZ
  #Time_Keep   On

[PARSER]
  Name docker
  Format json
  Time_Key time
  #Time_Format %Y-%m-%dT%H:%M:%SZ