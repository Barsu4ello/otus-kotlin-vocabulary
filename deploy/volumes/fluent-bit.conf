[SERVICE]
  log_level    info
  flush        1
  HTTP_Server  On
  HTTP_Listen  0.0.0.0
  HTTP_PORT    2020
  Health_Check On
  Parsers_File parsers.conf

[FILTER]
  Name parser
  Match app
  Key_Name log
  Parser json
  Reserve_Data On

[INPUT]
  Name tail
  Path /var/lib/docker/containers/*/*-json.log
  Parser docker
  Tag app

[OUTPUT]
  Name opensearch
  Match app
  Host ${opensearch_host}
  Port 9200
  HTTP_User ${opensearch_user}
  HTTP_Passwd ${opensearch_pass}
  Logstash_Prefix app-logs
  Logstash_DateFormat %Y.%m.%d
  Suppress_Type_Name On
  tls On
  tls.verify Off
  Trace_Error On
  net.keepalive On
  Buffer_Size 25M
  Index app-logs
